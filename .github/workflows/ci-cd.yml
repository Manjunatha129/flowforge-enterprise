name: FlowForge Production CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # -------------------------------------------------------------------
  # JOB 1: Backend Java 21 Unit Tests & Compilation
  # -------------------------------------------------------------------
  backend-build-test:
    name: Backend Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Unit & Integration Tests
        run: |
          cd flowforge-backend
          ./mvnw test -B

      - name: Package Spring Boot Production JAR
        run: |
          cd flowforge-backend
          ./mvnw clean package -DskipTests -B

      - name: Upload Backend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowforge-backend-jar
          path: flowforge-backend/target/*.jar

  # -------------------------------------------------------------------
  # JOB 2: Frontend React 18 Production Bundle & Verification
  # -------------------------------------------------------------------
  frontend-build-test:
    name: Frontend Build & Lint (React 18 + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: flowforge-frontend/package-lock.json

      - name: Install Dependencies & Build Bundle
        run: |
          cd flowforge-frontend
          npm ci
          npm run build

      - name: Upload Frontend Production Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowforge-frontend-dist
          path: flowforge-frontend/dist

  # -------------------------------------------------------------------
  # JOB 3: Docker Build Verification
  # -------------------------------------------------------------------
  docker-build-check:
    name: Verify Docker Container Build
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build-test]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./flowforge-backend
          push: false
          tags: flowforge/backend:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./flowforge-frontend
          push: false
          tags: flowforge/frontend:latest
