# ==========================================
# FlowForge Application Configuration
# ==========================================

spring.application.name=flowforge-backend
server.port=8080

# ==========================================
# Database Configuration
# Default: H2 In-Memory DB for zero-config instant execution
# Override via DB_URL / DB_USER / DB_PASSWORD for MySQL production deployment
# ==========================================
spring.datasource.url=${DB_URL:jdbc:h2:mem:flowforge_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# JWT Security Configuration Placeholders
# ==========================================
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==========================================
# CORS Configuration
# ==========================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175}
